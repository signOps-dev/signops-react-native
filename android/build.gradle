// The React Native module for Android. It compiles the native SDK's Kotlin (copied into src/main/java/com/signops/sdk
// by npm run sync) with a thin bridge, so there is no Maven dependency to resolve.
buildscript {
    ext.safeExtGet = { prop, fallback -> rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.signops.reactnative"
    compileSdkVersion safeExtGet("compileSdkVersion", 35)
    defaultConfig {
        minSdkVersion Math.max(safeExtGet("minSdkVersion", 28), 28) // passkeys and StrongBox keys need Android 9
        targetSdkVersion safeExtGet("targetSdkVersion", 35)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.core:core-ktx:1.13.1"
}
